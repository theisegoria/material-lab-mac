name: MaterialCapture
options:
  bundleIdPrefix: io.materiallab
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++23
    CLANG_CXX_LIBRARY: libc++
    IPHONEOS_DEPLOYMENT_TARGET: '27.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: NO
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/../../core/include
    SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/MaterialCapture-Bridging-Header.h
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_FILE: Sources/Info.plist
    GENERATE_INFOPLIST_FILE: NO
targets:
  MaterialCapture:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: ../../core/src/PBRMaterialLab.cpp
        # The derivation kernel is ~10x slower at -O0; optimize it in every configuration.
        compilerFlags: ['-std=c++23', '-O3']
    # The optional MoGe-2 learned-normal model (git-ignored, ~56 MB; see docs/LEARNED_NORMALS.md) is compiled into
    # the bundle when present. A script phase rather than a source reference: Xcode fails the build on a missing
    # .mlpackage even when XcodeGen marks the path optional, and builds without the model must still succeed.
    postCompileScripts:
      - name: Bundle learned normal model (optional)
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          src="$SRCROOT/../../third_party/moge/build/MoGe2Normals.mlpackage"
          dst="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          out="$dst/MoGe2Normals.mlmodelc"
          if [ ! -d "$src" ]; then
            echo "note: MoGe2Normals.mlpackage not found; building without the bundled learned-normal model"
            rm -rf "$out"
            exit 0
          fi
          if [ -f "$out/coremldata.bin" ] && [ -z "$(find "$src" -newer "$out/coremldata.bin" -print -quit)" ]; then
            exit 0
          fi
          rm -rf "$out"
          mkdir -p "$dst"
          xcrun coremlcompiler compile "$src" "$dst" --platform ios --deployment-target "$IPHONEOS_DEPLOYMENT_TARGET"
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: io.materiallab.capture
        PRODUCT_NAME: MaterialCapture
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - MaterialCaptureTests
        - MaterialCaptureUITests
  MaterialCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MaterialCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.materiallab.capture.tests
        GENERATE_INFOPLIST_FILE: YES

  MaterialCaptureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MaterialCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.materiallab.capture.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1'
